[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/F: erros e pyflakes; I: imports; B: bugbear; UP: modernização; S: bandit (segurança);
# DJ: boas práticas Django.
select = ["E", "F", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",  # assert é o idioma do pytest
  "S105",  # senhas literais em testes são dado de teste, não segredo
  "S106",
]
"apps/**/tests/**" = [
  "S101",
  "S105",
  "S106",
]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# django-allauth não publica tipos (sem py.typed); o plugin do django-stubs importa os models dele.
module = ["allauth.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
